name: CI

on:
  push:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: 1.27.4

      - name: Test
        run: make test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event.repository.fork
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::571355356645:role/gha-deploy-${{ github.repository_owner }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.2.0

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.login-ecr.outputs.registry }}/cawsperf-${{ github.repository_owner }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Render task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1.9.1
        with:
          task-definition-family: ${{ github.repository_owner }}-task-definition
          container-name: wsperf-application
          image: ${{ steps.login-ecr.outputs.registry }}/cawsperf-${{ github.repository_owner }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.4
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ github.repository_owner }}-service
          cluster: ${{ github.repository_owner }}-cluster
          desired-count: 1
          wait-for-service-stability: true
          wait-for-minutes: 10
